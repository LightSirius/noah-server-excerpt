<svg xmlns="http://www.w3.org/2000/svg" width="920" height="562" viewBox="0 0 920 562" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="CPU와 처리 시간 — 전환 전 vs 후">

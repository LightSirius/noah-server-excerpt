<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="920" height="562" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">CPU와 처리 시간 — 전환 전 vs 후</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">레벨별 중앙값. 스냅샷 = 주변 엔티티 변화를 모아 보내는 단계, ipcFlush = 월드가 게이트웨이로 내보내는 단계. 눈금은 묶음마다 공통</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#a3acb9"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">전환 전 (895d8b6 — JSON 본문)</text><rect x="235.31999999999996" y="70" width="12" height="12" rx="2" fill="#2f6fde"/><text x="252.31999999999996" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">전환 후 (B6 — 바이너리 본문)</text><text x="24" y="120" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">CPU 사용량 (낮을수록 좋음)</text><line x1="24" y1="127" x2="896" y2="127" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="151" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">monolith 서버 · 700명</text><rect x="254" y="139" width="330" height="15" rx="2" fill="#a3acb9"/><text x="590" y="151" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">0.66 코어</text><rect x="254" y="158" width="305" height="15" rx="2" fill="#2f6fde"/><text x="565" y="170" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">0.61 코어</text><text x="814" y="163" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−8%</text><text x="24" y="201" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">월드 · 1150명</text><rect x="254" y="189" width="365" height="15" rx="2" fill="#a3acb9"/><text x="625" y="201" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">0.73 코어</text><rect x="254" y="208" width="340" height="15" rx="2" fill="#2f6fde"/><text x="600" y="220" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">0.68 코어</text><text x="814" y="213" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−7%</text><text x="24" y="251" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">월드 · 1200명</text><rect x="254" y="239" width="370" height="15" rx="2" fill="#a3acb9"/><text x="630" y="251" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">0.74 코어</text><rect x="254" y="258" width="350" height="15" rx="2" fill="#2f6fde"/><text x="610" y="270" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">0.70 코어</text><text x="814" y="263" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−5%</text><text x="24" y="306" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">tick 안 단계 시간</text><line x1="24" y1="313" x2="896" y2="313" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="337" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">스냅샷 · monolith 700명</text><rect x="254" y="325" width="142.76923076923077" height="15" rx="2" fill="#a3acb9"/><text x="402.7692307692308" y="337" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">4.64 ms</text><rect x="254" y="344" width="126.76923076923077" height="15" rx="2" fill="#2f6fde"/><text x="386.7692307692308" y="356" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">4.12 ms</text><text x="814" y="349" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−11%</text><text x="24" y="387" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">스냅샷 · 월드 1150명</text><rect x="254" y="375" width="362.7692307692307" height="15" rx="2" fill="#a3acb9"/><text x="622.7692307692307" y="387" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">11.79 ms</text><rect x="254" y="394" width="310.1538461538462" height="15" rx="2" fill="#2f6fde"/><text x="570.1538461538462" y="406" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">10.08 ms</text><text x="814" y="399" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−15%</text><text x="24" y="437" fon
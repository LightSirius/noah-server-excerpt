<svg xmlns="http://www.w3.org/2000/svg" width="900" height="508" viewBox="0 0 900 508" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="CPU 배치 함정">
<title>CPU 배치 함정</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="508" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">측정의 함정 — CPU 배치가 결과를 바꿨다</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">B2b·B3b 측정에서 늘 'B 쪽이 2 ms 느리다'가 나왔다. 원인은 코드가 아니라 A 서버가 놓인 CPU였다</text><text x="24" y="92" font-size="13.5" text-anchor="start" font-weight="700" fill="#1f2933">B2b·B3b 측정 (pinmon이 ~/mmorpg만 서버로 인식)</text><rect x="24" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="39" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">0</text><rect x="24" y="137" width="29" height="13" rx="2" fill="#a3acb9"/><text x="39" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2933">A</text><rect x="58" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="73" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">1</text><rect x="58" y="137" width="29" height="13" rx="2" fill="#a3acb9"/><text x="73" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2933">A</text><rect x="92" y="104" width="30" height="30" rx="4" fill="#3e4c59"/><text x="107" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">2</text><rect x="92" y="137" width="29" height="13" rx="2" fill="#2f6fde"/><text x="107" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#fff">B</text><rect x="126" y="104" width="30" height="30" rx="4" fill="#3e4c59"/><text x="141" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">3</text><rect x="126" y="137" width="29" height="13" rx="2" fill="#2f6fde"/><text x="141" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#fff">B</text><rect x="160" y="104" width="30" height="30" rx="4" fill="#9aa5b1"/><text x="175" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">4</text><rect x="194" y="104" width="30" height="30" rx="4" fill="#9aa5b1"/><text x="209" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">5</text><rect x="228" y="104" width="30" height="30" rx="4" fill="#9aa5b1"/><text x="243" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">6</text><rect x="262" y="104" width="30" height="30" rx="4" fill="#9aa5b1"/><text x="277" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">7</text><rect x="296" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="311" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">8</text><rect x="296" y="137" width="29" height="13" rx="2" fill="#a3acb9"/><text x="311" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2933">A</text><rect x="330" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="345" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">9</text><rect x="330" y="137" width="29" height="13" rx="2" fill="#a3acb9"/><text x="345" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2933">A</text><rect x="364" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="379" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">10</text><rect x="364" y="137" width="29" height="13" rx="2" fill="#a3acb9"/><text x="379" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2933">A</text><rect x="398" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="413" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">11</text><rect x="398" y="137" width="29" height="13" rx="2" fill="#a3acb9"/><text x="413" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2933">A</text><text x="24" y="172" font-size="12" text-anchor="start" font-weight="700" fill="#d64545">A 서버 → 부하 생성기 CPU(0,1,8–11)에 같이 놓임 ✗</text><text x="470" y="92" font-size="13.5" text-anchor="start" font-weight="700" fill="#1f2933">B6 최종 측정 (pinmon 수정)</text><rect x="470" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="485" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">0</text><rect x="504" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="519" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">1</text><rect x="538" y="104" width="30" height="30" rx="4" fill="#3e4c59"/><text x="553" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">2</text><rect x="538" y="137" width="14" height="13" rx="2" fill="#a3acb9"/><text x="545.5" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2933">A</text><rect x="553" y="137" width="14" height="13" rx="2" fill="#2f6fde"/><text x="560.5" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#fff">B</text><rect x="572" y="104" width="30" height="30" rx="4" fill="#3e4c59"/><text x="587" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">3</text><rect x="572" y="137" width="14" height="13" rx="2" fill="#a3acb9"/><text x="579.5" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2933">A</text><rect x="587" y="137" width="14" height="13" rx="2" fill="#2f6fde"/><text x="594.5" y="147" font-size="9.5" text-anchor="middle" font-weight="700" fill="#fff">B</text><rect x="606" y="104" width="30" height="30" rx="4" fill="#9aa5b1"/><text x="621" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">4</text><rect x="640" y="104" width="30" height="30" rx="4" fill="#9aa5b1"/><text x="655" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">5</text><rect x="674" y="104" width="30" height="30" rx="4" fill="#9aa5b1"/><text x="689" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">6</text><rect x="708" y="104" width="30" height="30" rx="4" fill="#9aa5b1"/><text x="723" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">7</text><rect x="742" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="757" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">8</text><rect x="776" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="791" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">9</text><rect x="810" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="825" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">10</text><rect x="844" y="104" width="30" height="30" rx="4" fill="#e4e7eb"/><text x="859" y="124" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2933">11</text><text x="470" y="172" font-size="12" text-anchor="start" font-weight="700" fill="#2e9e5b">A 서버도 2,3에 고정 — 대칭 ✓</text><rect x="24" y="194" width="12" height="12" rx="2" fill="#e4e7eb"/><text x="41" y="204" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">0,1,8–11 부하 생성기</text><rect x="184.2" y="194" width="12" height="12" rx="2" fill="#3e4c59"/><text x="201.2" y="204" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">2,3 monolith·월드 (물리 코어 1개)</text><rect x="416.52" y="194" width="12" height="12" rx="2" fill="#9aa5b1"/><text x="433.52" y="204" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">4,5 / 6,7 게이트웨이 1·2</text><rect x="592.92" y="194" width="12" height="12" rx="2" fill="#a3acb9"/><text x="609.92" y="204" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">A 서버 위치</text><rect x="690.48" y="194" width="12" height="12" rx="2" fill="#2f6fde"/><text x="707.48" y="204" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">B 서버 위치</text><text x="24" y="240" font-size="14" text-anchor="start" font-weight="700" fill="#1f2933">monolith 700명 소켓 쓰기(flush) 시간 — 낮을수록 빠름</text><text x="24" y="278" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">B2b 측정 (A 서버만 부하 CPU)</text><rect x="330" y="260" width="340.5" height="15" rx="2" fill="#a3acb9"/><text x="676.5" y="272" font-size="11" text-anchor="start" font-weight="400" fill="#52606d">A 11.2–11.5 ms</text><rect x="330" y="279" width="399" height="15" rx="2" fill="#2f6fde"/><text x="735" y="291" font-size="11" text-anchor="start" font-weight="700" fill="#2f6fde">B 13.1–13.5 ms</text><text x="24" y="330" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">B6 대조: 같은 커밋·대칭 배치</text><rect x="330" y="312" width="401.40000000000003" height="15" rx="2" fill="#a3acb9"/><text x="737.4000000000001" y="324" font-size="11" text-anchor="start" font-weight="400" fill="#52606d">A 13.38 ms</text><rect x="330" y="331" width="401.09999999999997" height="15" rx="2" fill="#2f6fde"/><text x="737.0999999999999" y="343" font-size="11" text-anchor="start" font-weight="700" fill="#2f6fde">B 13.37 ms</text><text x="24" y="382" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">B6 재현: 같은 커밋·A만 부하 CPU</text><rect x="330" y="364" width="326.70000000000005" height="15" rx="2" fill="#a3acb9"/><text x="662.7" y="376" font-size="11" text-anchor="start" font-weight="400" fill="#52606d">A 10.7–11.1 ms</text><rect x="330" y="383" width="399" height="15" rx="2" fill="#2f6fde"/><text x="735" y="395" font-size="11" text-anchor="start" font-weight="700" fill="#2f6fde">B 13.3 ms</text><rect x="24" y="416" width="852" height="76" rx="6" fill="#f5f7fa"/><text x="40" y="438" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">결론: 커밋과 의존성이 같아도 A만 부하 생성기 CPU에 두면 'B 쪽 flush +2 ms(재현 +2.3–2.5) · 게이트웨이 2개 구성 부하 생성기 CPU +28%'가 그대로 나타난다.</text><text x="40" y="458" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">→ B2b·B3b의 시간·CPU 비교는 무효(이 측정이 대체), 바이트·GC 횟수는 방향만 유효. 전용 코어(2,3) 고정이 보수적인 기준이다.</text><text x="40" y="478" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">교훈: 교차 측정은 런마다 프로세스가 어느 CPU에 놓였는지(pin 이벤트)부터 확인한다 — ~/an/pincheck.py</text>
</svg>

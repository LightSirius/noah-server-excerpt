<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="패킷 형식 전후 비교">
<title>패킷 형식 전후 비교</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="330" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">패킷 한 개는 어떻게 생겼나 — 이동 입력(INPUT_CMD) 예시</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">헤더(머리표) + 본문(내용물). 같은 내용 {seq 12345, tick 67890, dx 1, dy 0, action 0}</text><text x="24" y="106" font-size="13" text-anchor="start" font-weight="700" fill="#1f2933">전환 전 (JSON)</text><rect x="190" y="84" width="22" height="34" rx="0" fill="#3e4c59" stroke="#ffffff" stroke-width="1.5"/><text x="201" y="105" font-size="11" text-anchor="middle" font-weight="400" fill="#fff">id</text><rect x="212" y="84" width="44" height="34" rx="0" fill="#52606d" stroke="#ffffff" stroke-width="1.5"/><text x="234" y="105" font-size="11" text-anchor="middle" font-weight="400" fill="#fff">len</text><rect x="256" y="84" width="561" height="34" rx="0" fill="#a3acb9" stroke="#ffffff" stroke-width="1.5"/><text x="536.5" y="105" font-size="11" text-anchor="middle" font-weight="400" fill="#1f2933">본문 51 B — 글자로 쓴 JSON</text><text x="827" y="106" font-size="13" text-anchor="start" font-weight="700" fill="#1f2933">57 B</text><text x="262" y="140" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">{"seq":12345,"tick":67890,"dx":1,"dy":0,"action":0}</text><text x="190" y="158" font-size="11.5" text-anchor="start" font-weight="400" fill="#7b8794">헤더 6 B: [id u16 BE][len u32 BE] — 필드 이름·따옴표·쉼표까지 매번 글자로 보낸다</text><text x="24" y="200" font-size="13" text-anchor="start" font-weight="700" fill="#1f2933">전환 후 (바이너리)</text><rect x="190" y="178" width="22" height="34" rx="0" fill="#52606d" stroke="#ffffff" stroke-width="1.5"/><text x="201" y="199" font-size="10.7" text-anchor="middle" font-weight="400" fill="#fff">len</text><rect x="212" y="178" width="22" height="34" rx="0" fill="#3e4c59" stroke="#ffffff" stroke-width="1.5"/><text x="223" y="199" font-size="11" text-anchor="middle" font-weight="400" fill="#fff">id</text><rect x="234" y="178" width="44" height="34" rx="0" fill="#2f6fde" stroke="#ffffff" stroke-width="1.5"/><text x="256" y="199" font-size="11" text-anchor="middle" font-weight="400" fill="#fff">seq</text><rect x="278" y="178" width="44" height="34" rx="0" fill="#4a84e8" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="199" font-size="11" text-anchor="middle" font-weight="400" fill="#fff">tick</text><rect x="322" y="178" width="44" height="34" rx="0" fill="#2f6fde" stroke="#ffffff" stroke-width="1.5"/><text x="344" y="199" font-size="11" text-anchor="middle" font-weight="400" fill="#fff">dx</text><rect x="366" y="178" width="44" height="34" rx="0" fill="#4a84e8" stroke="#ffffff" stroke-width="1.5"/><text x="388" y="199" font-size="11" text-anchor="middle" font-weight="400" fill="#fff">dy</text><rect x="410" y="178" width="44" height="34" rx="0" fill="#2f6fde" stroke="#ffffff" stroke-width="1.5"/><text x="432" y="199" font-size="11" text-anchor="middle" font-weight="400" fill="#fff">action</text><text x="464" y="200" font-size="13" text-anchor="start" font-weight="700" fill="#1f2933">24 B</text><text x="190" y="234" font-size="11.5" text-anchor="start" font-weight="400" fill="#7b8794">헤더 4 B: [len u16 LE][id u16 LE] — 본문은 정해진 자리에 숫자만(i32 × 5 = 20 B), 이름은 스키마가 안다</text><rect x="24" y="254" width="852" height="58" rx="6" fill="#f5f7fa"/><text x="40" y="278" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">비유: JSON은 매번 "이름: 홍길동, 주소: …"라고 손으로 쓴 편지, 바이너리는 칸이 정해진 양식지에 값만 적는 것.</text><text x="40" y="298" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">양식(packets.json 스키마)은 서버(TS)와 클라(C#)가 같은 파일에서 코드를 자동 생성해 공유한다 — 칸이 어긋날 수 없다.</text>
</svg>

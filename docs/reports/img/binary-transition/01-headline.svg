<svg xmlns="http://www.w3.org/2000/svg" width="900" height="674" viewBox="0 0 900 674" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="이진 전환 전후 핵심 변화">
<title>이진 전환 전후 핵심 변화</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="674" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">이진 전환 전후 — 무엇이 얼마나 바뀌었나</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">전환 전(895d8b6) 대비 B6 · 같은 날·같은 CPU 배치 · 중앙값(GC는 2런 평균)</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#2e9e5b"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">줄어듦 (좋아짐)</text><rect x="147" y="70" width="12" height="12" rx="2" fill="#7b8794"/><text x="164" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">차이 단정 불가</text><rect x="260.15999999999997" y="70" width="12" height="12" rx="2" fill="#e8890c"/><text x="277.15999999999997" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">늘었지만 원인 미확인</text><line x1="610" y1="100" x2="610" y2="658" stroke="#7b8794" stroke-width="1"/><text x="24" y="114" font-size="12.5" text-anchor="start" font-weight="700" fill="#52606d">네트워크</text><text x="24" y="139" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">클라 → 서버 바이트 (서버 수신)</text><text x="24" y="155" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">775 → 344 KB/s (monolith 700명)</text><rect x="330" y="130" width="280" height="20" rx="2" fill="#2e9e5b"/><text x="322" y="145" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−56%</text><text x="24" y="181" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">월드 → 게이트웨이 내부 통신 (IPC)</text><text x="24" y="197" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">17.1 → 9.4 MB/s (1200명)</text><rect x="385" y="172" width="225" height="20" rx="2" fill="#2e9e5b"/><text x="377" y="187" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−45%</text><text x="24" y="223" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">서버 → 클라 바이트</text><text x="24" y="239" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">45.8 → 42.9 MB/s (monolith 700명)</text><rect x="580" y="214" width="30" height="20" rx="2" fill="#2e9e5b"/><text x="572" y="229" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−6%</text><text x="24" y="264" font-size="12.5" text-anchor="start" font-weight="700" fill="#52606d">CPU · 처리 시간</text><text x="24" y="289" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">서버 CPU (monolith)</text><text x="24" y="305" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">0.66 → 0.61 코어</text><rect x="570" y="280" width="40" height="20" rx="2" fill="#2e9e5b"/><text x="562" y="295" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−8%</text><text x="24" y="331" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">월드 CPU (게이트웨이 2개 구성)</text><text x="24" y="347" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">0.73 → 0.68 코어 (1150명) · 1200명 −5%</text><rect x="575" y="322" width="35" height="20" rx="2" fill="#2e9e5b"/><text x="567" y="337" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−7%</text><text x="24" y="373" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">스냅샷 처리 시간</text><text x="24" y="389" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">4.64 → 4.12 ms (700명) · 구성별 −9~15%</text><rect x="555" y="364" width="55" height="20" rx="2" fill="#2e9e5b"/><text x="547" y="379" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−11%</text><text x="24" y="414" font-size="12.5" text-anchor="start" font-weight="700" fill="#52606d">tick (서버 갱신 1회 시간)</text><text x="24" y="439" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">tick 평균 — 게이트웨이 2개 구성</text><text x="24" y="455" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">15.6 → 13.7 ms (1150명) · 1200명 −8%</text><rect x="550" y="430" width="60" height="20" rx="2" fill="#2e9e5b"/><text x="542" y="445" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−8~12%</text><text x="24" y="481" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">tick 평균 — monolith 700명</text><text x="24" y="497" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">18.9 → 18.5 ms — 런 편차 안</text><rect x="600" y="472" width="10" height="20" rx="2" fill="#7b8794"/><text x="592" y="487" font-size="14" text-anchor="end" font-weight="700" fill="#7b8794">≈ −2%</text><text x="24" y="523" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">tick p99 (가장 느린 1%)</text><text x="24" y="539" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">줄었다고 확인 안 됨 — 1150명 −15%는 판정 보류</text><rect x="608" y="514" width="4" height="20" rx="0" fill="#7b8794"/><text x="620" y="529" font-size="14" text-anchor="start" font-weight="700" fill="#7b8794">≈ 0</text><text x="24" y="564" font-size="12.5" text-anchor="start" font-weight="700" fill="#52606d">GC (메모리 청소)</text><text x="24" y="589" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">monolith 할당 추정</text><text x="24" y="605" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">추정 방법에 따라 −8~11% · eden 횟수 −14%</text><rect x="570" y="580" width="40" height="20" rx="2" fill="#2e9e5b"/><text x="562" y="595" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−8~11%</text><text x="24" y="631" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">월드 eden(짧은 청소) 횟수</text><text x="24" y="647" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">2,448 → 2,651회 (2쌍) · 할당 추정 +27% — 원인 미확인</text><rect x="610" y="622" width="40" height="20" rx="2" fill="#e8890c"/><text x="658" y="637" font-size="14" text-anchor="start" font-weight="700" fill="#e8890c">+8%</text>
</svg>

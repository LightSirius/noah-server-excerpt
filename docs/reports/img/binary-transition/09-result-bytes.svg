<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="네트워크 바이트 — 전환 전 vs 후">
<title>네트워크 바이트 — 전환 전 vs 후</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="920" height="580" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">네트워크 바이트 — 전환 전 vs 후</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">같은 날 번갈아 측정, spread 시나리오, 레벨별 중앙값(monolith 5런, 게이트웨이 2개 구성 3런). 막대 눈금은 묶음마다 공통</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#a3acb9"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">전환 전 (895d8b6 — JSON 본문)</text><rect x="235.31999999999996" y="70" width="12" height="12" rx="2" fill="#2f6fde"/><text x="252.31999999999996" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">전환 후 (B6 — 바이너리 본문)</text><text x="24" y="120" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">클라 → 서버 (서버가 받는 바이트)</text><line x1="24" y1="127" x2="896" y2="127" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="151" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">monolith 700명</text><rect x="254" y="139" width="221.42857142857144" height="15" rx="2" fill="#a3acb9"/><text x="481.42857142857144" y="151" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">775 KB/s</text><rect x="254" y="158" width="98.28571428571428" height="15" rx="2" fill="#2f6fde"/><text x="358.2857142857143" y="170" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">344 KB/s</text><text x="814" y="163" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−56%</text><text x="24" y="201" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">게이트웨이 2개 · 1150명</text><rect x="254" y="189" width="363.7142857142858" height="15" rx="2" fill="#a3acb9"/><text x="623.7142857142858" y="201" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">1,273 KB/s</text><rect x="254" y="208" width="161.42857142857144" height="15" rx="2" fill="#2f6fde"/><text x="421.42857142857144" y="220" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">565 KB/s</text><text x="814" y="213" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−56%</text><text x="24" y="251" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">게이트웨이 2개 · 1200명</text><rect x="254" y="239" width="379.42857142857144" height="15" rx="2" fill="#a3acb9"/><text x="639.4285714285714" y="251" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">1,328 KB/s</text><rect x="254" y="258" width="168.57142857142856" height="15" rx="2" fill="#2f6fde"/><text x="428.57142857142856" y="270" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">590 KB/s</text><text x="814" y="263" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−56%</text><text x="24" y="306" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">월드 → 게이트웨이 내부 통신 (IPC)</text><line x1="24" y1="313" x2="896" y2="313" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="337" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">1150명</text><rect x="254" y="325" width="352.66666666666663" height="15" rx="2" fill="#a3acb9"/><text x="612.6666666666666" y="337" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">15.9 MB/s</text><rect x="254" y="344" width="194.22222222222223" height="15" rx="2" fill="#2f6fde"/><text x="454.22222222222223" y="356" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">8.7 MB/s</text><text x="814" y="349" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−45%</text><text x="24" y="387" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">1200명</text><rect x="254" y="375" width="380" height="15" rx="2" fill="#a3acb9"/><text x="640" y="387" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">17.1 MB/s</text><rect x="254" y="394" width="209.55555555555554" height="15" rx="2" fill="#2f6fde"/><text x="469.55555555555554" y="406" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">9.4 MB/s</text><text x="814" y="399" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−45%</text><text x="24" y="442" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">서버 → 클라</text><line x1="24" y1="449" x2="896" y2="449" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="473" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">monolith 700명</text><rect x="254" y="461" width="130.71428571428572" height="15" rx="2" fill="#a3acb9"/><text x="390.7142857142857" y="473" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">45.8 MB/s</text><rect x="254" y="480" width="122.68571428571431" height="15" rx="2" fill="#2f6fde"/><text x="382.6857142857143" y="492" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">42.9 MB/s</text><text x="814" y="485" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−6%</text><text x="24" y="523" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">게이트웨이 2개 · 1200명</text><text x="24" y="540" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">게이트웨이 2개 합</text><rect x="254" y="511" width="384.2857142857142" height="15" rx="2" fill="#a3acb9"/><text x="644.2857142857142" y="523" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">134.5 MB/s</text><rect x="254" y="530" width="361.1428571428571" height="15" rx="2" fill="#2f6fde"/><text x="621.1428571428571" y="542" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">126.4 MB/s</text><text x="814" y="535" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−6%</text>
</svg>

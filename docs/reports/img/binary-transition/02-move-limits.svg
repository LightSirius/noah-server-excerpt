<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="초당 이동 입력 비교">
<title>초당 이동 입력 비교</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="510" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">초당 이동 입력 — 정상 사용량과 제한값</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">웹 조사(게임 Rust · Minecraft · Valve Source 엔진 · Overwatch)와 우리 서버 비교. 막대 눈금은 패널마다 다르다</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#2e9e5b"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">정상 사용량</text><rect x="122.39999999999999" y="70" width="12" height="12" rx="2" fill="#e8890c"/><text x="139.39999999999998" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">클릭 연타</text><rect x="209.64" y="70" width="12" height="12" rx="2" fill="#2f6fde"/><text x="226.64" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">우리 제한값</text><rect x="308.03999999999996" y="70" width="12" height="12" rx="2" fill="#a3acb9"/><text x="325.03999999999996" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">다른 게임(참고)</text><text x="24" y="110" font-size="14" text-anchor="start" font-weight="700" fill="#1f2933">연결당 전체 패킷 (초당)</text><text x="24" y="139" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">정상 클라 합계</text><rect x="280" y="127" width="29.400000000000002" height="16" rx="2" fill="#2e9e5b"/><text x="317.4" y="140" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">≈21 (INPUT_CMD 20 + PING 1 + MOVE_TO)</text><text x="24" y="165" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">게임 Rust — 클라 송신</text><rect x="280" y="153" width="44.800000000000004" height="16" rx="2" fill="#a3acb9"/><text x="332.8" y="166" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">32</text><text x="24" y="191" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">우리 서버 전체 상한</text><rect x="280" y="179" width="140" height="16" rx="2" fill="#2f6fde"/><text x="428" y="192" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">100 — 유지 (정상의 ≈5배 여유)</text><text x="24" y="217" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">게임 Rust — 서버 상한</text><rect x="280" y="205" width="420" height="16" rx="2" fill="#a3acb9"/><text x="708" y="218" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">300 (클라의 ≈9배)</text><text x="24" y="258" font-size="14" text-anchor="start" font-weight="700" fill="#1f2933">MOVE_TO — 클릭 이동 요청 (초당)</text><text x="24" y="287" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">평소 평균</text><rect x="280" y="275" width="10.5" height="16" rx="2" fill="#2e9e5b"/><text x="298.5" y="288" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">0.3</text><text x="24" y="313" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">몬스터 추격 최대</text><rect x="280" y="301" width="140" height="16" rx="2" fill="#2e9e5b"/><text x="428" y="314" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">4</text><text x="24" y="339" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">클릭 연타</text><rect x="280" y="327" width="175" height="16" rx="2" fill="#e8890c"/><rect x="455" y="327" width="175" height="16" rx="2" fill="#e8890c" fill-opacity="0.35" stroke="#e8890c" stroke-width="1" stroke-dasharray="3 2"/><text x="638" y="340" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">5~10</text><text x="24" y="365" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">클라 자체 제한 (신규)</text><rect x="280" y="353" width="245.00000000000003" height="16" rx="2" fill="#2f6fde"/><text x="533" y="366" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">7 — 정상 클라는 서버 제한에 안 닿음</text><text x="24" y="391" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2933">서버 제한 (신규)</text><rect x="280" y="379" width="280" height="16" rx="2" fill="#2f6fde"/><text x="568" y="392" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">8 · 버스트 8 · 넘치면 최신 1건만 보류</text><rect x="24" y="418" width="852" height="74" rx="6" fill="#f5f7fa"/><text x="40" y="440" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">INPUT_CMD(키보드 이동)는 이미 업계 방식과 같다 — tick당 1건만 적용(Source·Overwatch), 대기열 32(Minecraft는 tick 사이 5개를 넘으면 잘라냄).</text><text x="40" y="460" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">더 조이면 순간 끊김 뒤 몰려온 정상 입력이 버려진다 → 유지.</text><text x="40" y="480" font-size="12" text-anchor="start" font-weight="400" fill="#d64545">구멍은 MOVE_TO: 요청 하나가 경로 탐색(A*) + 시야 안 전원에게 MOVE_PATH 전송 → 나가는 패킷이 MOVE_TO의 ≈260배인데 제한이 없었다.</text>
</svg>

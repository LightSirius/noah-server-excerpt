<svg xmlns="http://www.w3.org/2000/svg" width="900" height="358" viewBox="0 0 900 358" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="MOVE_TO 속도 제한 흐름">
<title>MOVE_TO 속도 제한 흐름</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="358" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">MOVE_TO 속도 제한은 이렇게 동작한다</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">연결마다 토큰 버킷(초당 8개 충전, 최대 8개). 정상 범위 요청은 예전과 똑같은 경로(바이트 단위로 동일)</text><rect x="24" y="90" width="150" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.2"/><text x="99" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2933">클라 MOVE_TO</text><text x="99" y="131.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">목표 지점 클릭</text><rect x="214" y="90" width="150" height="56" rx="8" fill="#fff" stroke="#7b8794" stroke-width="1.2"/><text x="289" y="123" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2933">사망 중?</text><rect x="214" y="178" width="150" height="40" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="1.2"/><text x="289" y="203" font-size="13" text-anchor="middle" font-weight="700" fill="#d64545">무시 (토큰 안 씀)</text><rect x="404" y="90" width="160" height="56" rx="8" fill="#fff" stroke="#7b8794" stroke-width="1.2"/><text x="484" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2933">토큰 남았나?</text><text x="484" y="131.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">버킷 8/s · 최대 8</text><rect x="604" y="74" width="272" height="56" rx="8" fill="#e6f4ec" stroke="#2e9e5b" stroke-width="1.2"/><text x="740" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#2e9e5b">즉시 처리</text><text x="740" y="115.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">A* 경로 → 주변에 MOVE_PATH</text><rect x="604" y="150" width="272" height="56" rx="8" fill="#fff4e5" stroke="#e8890c" stroke-width="1.2"/><text x="740" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#e8890c">보류 1칸에 덮어쓰기</text><text x="740" y="191.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">최신 요청만 남김 (latest-wins)</text><rect x="604" y="236" width="272" height="72" rx="8" fill="#e6f4ec" stroke="#2e9e5b" stroke-width="1.2"/><text x="740" y="260" font-size="13" text-anchor="middle" font-weight="700" fill="#2e9e5b">다음 tick 직전마다 확인</text><text x="740" y="277" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">토큰이 생겼으면 해제 → A* 처리</text><text x="740" y="294" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">존 바뀜·사망이면 폐기, 토큰 없으면 대기</text><rect x="214" y="248" width="350" height="44" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="1.2"/><text x="389" y="266.5" font-size="13" text-anchor="middle" font-weight="700" fill="#d64545">취소: MOVE_STOP 또는 키보드 이동 입력</text><text x="389" y="283.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">보류된 요청 폐기</text><line x1="174" y1="118" x2="210" y2="118" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar-ink)"/><line x1="364" y1="118" x2="400" y2="118" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar-ink)"/><text x="382" y="110" font-size="10.5" text-anchor="middle" font-weight="400" fill="#52606d">아니오</text><line x1="289" y1="146" x2="289" y2="174" stroke="#d64545" stroke-width="1.4" marker-end="url(#ar-bad)"/><text x="296" y="164" font-size="10.5" text-anchor="start" font-weight="400" fill="#d64545">예</text><line x1="564" y1="108" x2="600" y2="100" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ar-good)"/><text x="582" y="96" font-size="10.5" text-anchor="middle" font-weight="400" fill="#2e9e5b">예</text><line x1="564" y1="130" x2="600" y2="172" stroke="#e8890c" stroke-width="1.4" marker-end="url(#ar-warn)"/><text x="566" y="156" font-size="10.5" text-anchor="end" font-weight="400" fill="#e8890c">아니오</text><line x1="740" y1="206" x2="740" y2="232" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ar-good)"/><line x1="566" y1="262" x2="600" y2="200" stroke="#d64545" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar-bad)"/><text x="574" y="232" font-size="10.5" text-anchor="end" font-weight="400" fill="#d64545">보류 폐기</text><text x="24" y="338" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">메트릭 mmorpg_move_to_throttle_total{outcome = deferred · coalesced · released · cancelled} 로 보류·덮어쓰기·해제·취소 건수를 본다.</text>
</svg>

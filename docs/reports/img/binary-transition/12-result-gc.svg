<svg xmlns="http://www.w3.org/2000/svg" width="920" height="466" viewBox="0 0 920 466" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="GC(메모리 청소) — monolith는 줄었고, 월드 eden·할당 추정은 늘었다">
<title>GC(메모리 청소) — monolith는 줄었고, 월드 eden·할당 추정은 늘었다</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="920" height="466" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">GC(메모리 청소) — monolith는 줄었고, 월드 eden·할당 추정은 늘었다</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">GC 로그 런(1회 ≈45–51초) 평균 · eden = 짧은 청소 횟수, 할당 추정 = 런 동안 새로 만든 메모리 양 · 눈금은 지표마다 공통</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#a3acb9"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">전환 전 (895d8b6 — JSON 본문)</text><rect x="235.31999999999996" y="70" width="12" height="12" rx="2" fill="#2f6fde"/><text x="252.31999999999996" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">전환 후 (B6 — 바이너리 본문)</text><text x="24" y="120" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">monolith 700명 (2쌍)</text><line x1="24" y1="127" x2="896" y2="127" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="151" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">eden 청소 횟수</text><rect x="254" y="139" width="284.2857142857142" height="15" rx="2" fill="#a3acb9"/><text x="544.2857142857142" y="151" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">1,990회</text><rect x="254" y="158" width="244.92857142857144" height="15" rx="2" fill="#2f6fde"/><text x="504.92857142857144" y="170" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">1,715회</text><text x="814" y="163" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−14%</text><text x="24" y="201" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">할당 추정</text><rect x="254" y="189" width="135" height="15" rx="2" fill="#a3acb9"/><text x="395" y="201" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">20.3 GiB</text><rect x="254" y="208" width="123.66666666666669" height="15" rx="2" fill="#2f6fde"/><text x="383.6666666666667" y="220" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">18.6 GiB</text><text x="814" y="213" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−8%</text><text x="822" y="213" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">다른 방법은 −11%</text><text x="24" y="256" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">월드 · 게이트웨이 2개 1200명 (2쌍)</text><line x1="24" y1="263" x2="896" y2="263" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="287" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">eden 청소 횟수 (하한*)</text><rect x="254" y="275" width="349.6428571428571" height="15" rx="2" fill="#a3acb9"/><text x="609.6428571428571" y="287" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">2,448회</text><rect x="254" y="294" width="378.71428571428567" height="15" rx="2" fill="#2f6fde"/><text x="638.7142857142857" y="306" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">2,651회</text><text x="814" y="299" font-size="17" text-anchor="end" font-weight="700" fill="#e8890c">+8%</text><text x="822" y="299" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">원인 미확인</text><text x="24" y="337" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">할당 추정</text><rect x="254" y="325" width="302" height="15" rx="2" fill="#a3acb9"/><text x="562" y="337" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">45.3 GiB</text><rect x="254" y="344" width="385" height="15" rx="2" fill="#2f6fde"/><text x="645" y="356" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">57.8 GiB</text><text x="814" y="349" font-size="17" text-anchor="end" font-weight="700" fill="#e8890c">+27%</text><text x="822" y="349" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">원인 미확인</text><text x="24" y="386" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">* 프로세스 4개의 GC 로그가 한 파일에 섞여 월드 수집 일부(≈2–6%)를 세지 못한다 — A·B 모두 같은 방식이라 방향 비교는 유효.</text><text x="24" y="404" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">full(전체 청소)은 줄었다 — 월드 ≥40–43 → ≥27회, monolith 23–24 → 19회. 꼬리와의 관계는 미확인.</text><text x="24" y="422" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">처음 동기였던 "이동 입력 JSON이 GC의 주원인" 가설은 B2b 측정에서 기각 — JSON을 다 걷어낸 지금도 월드 eden은 줄지 않았다.</text><text x="24" y="440" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">월드 증가분의 원인(B4~B6 커밋인지, 측정 방식인지)은 미확인 → 다음 작업: 두 커밋에서 할당 프로파일.</text>
</svg>

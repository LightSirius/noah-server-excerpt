<svg xmlns="http://www.w3.org/2000/svg" width="920" height="496" viewBox="0 0 920 496" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="같은 내용, 패킷 크기 비교 (헤더 포함 프레임 바이트)">
<title>같은 내용, 패킷 크기 비교 (헤더 포함 프레임 바이트)</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="920" height="496" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">같은 내용, 패킷 크기 비교 (헤더 포함 프레임 바이트)</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">대표 예시 값으로 계산 — 전환 전 = 헤더 6 B + JSON, 전환 후 = 헤더 4 B + 바이너리</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#a3acb9"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">전환 전 (JSON)</text><rect x="144" y="70" width="12" height="12" rx="2" fill="#2f6fde"/><text x="161" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">전환 후 (바이너리)</text><text x="24" y="121" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">INPUT_CMD</text><text x="24" y="138" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">이동 입력 (초당 20회 × 접속자)</text><rect x="254" y="109" width="152" height="15" rx="2" fill="#a3acb9"/><text x="412" y="121" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">57 B</text><rect x="254" y="128" width="64" height="15" rx="2" fill="#2f6fde"/><text x="324" y="140" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">24 B</text><text x="814" y="133" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−58%</text><text x="24" y="171" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">DAMAGE_EVENT</text><text x="24" y="188" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">피해 표시</text><rect x="254" y="159" width="256" height="15" rx="2" fill="#a3acb9"/><text x="516" y="171" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">96 B</text><rect x="254" y="178" width="48" height="15" rx="2" fill="#2f6fde"/><text x="308" y="190" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">18 B</text><text x="814" y="183" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−81%</text><text x="24" y="221" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">ENTITY_SPAWN</text><text x="24" y="238" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">몬스터가 시야에 들어옴</text><rect x="254" y="209" width="368" height="15" rx="2" fill="#a3acb9"/><text x="628" y="221" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">138 B</text><rect x="254" y="228" width="138.66666666666669" height="15" rx="2" fill="#2f6fde"/><text x="398.6666666666667" y="240" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">52 B</text><text x="814" y="233" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−62%</text><text x="24" y="271" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">MOVE_PATH</text><text x="24" y="288" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">이동 경로 (경유점 5개)</text><rect x="254" y="259" width="386.66666666666674" height="15" rx="2" fill="#a3acb9"/><text x="646.6666666666667" y="271" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">145 B</text><rect x="254" y="278" width="144" height="15" rx="2" fill="#2f6fde"/><text x="404" y="290" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">54 B</text><text x="814" y="283" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−63%</text><text x="24" y="321" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">ENTITY_META</text><text x="24" y="338" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">HP·레벨 갱신</text><rect x="254" y="309" width="138.66666666666669" height="15" rx="2" fill="#a3acb9"/><text x="398.6666666666667" y="321" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">52 B</text><rect x="254" y="328" width="53.333333333333314" height="15" rx="2" fill="#2f6fde"/><text x="313.3333333333333" y="340" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">20 B</text><text x="814" y="333" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−62%</text><text x="24" y="371" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">MOVE_TO</text><text x="24" y="388" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">클릭 이동 요청</text><rect x="254" y="359" width="160" height="15" rx="2" fill="#a3acb9"/><text x="420" y="371" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">60 B</text><rect x="254" y="378" width="53.333333333333314" height="15" rx="2" fill="#2f6fde"/><text x="313.3333333333333" y="390" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">20 B</text><text x="814" y="383" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−67%</text><text x="24" y="421" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">PING</text><text x="24" y="438" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">지연 측정</text><rect x="254" y="409" width="101.33333333333337" height="15" rx="2" fill="#a3acb9"/><text x="361.33333333333337" y="421" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">38 B</text><rect x="254" y="428" width="32" height="15" rx="2" fill="#2f6fde"/><text x="292" y="440" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">12 B</text><text x="814" y="433" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−68%</text><text x="24" y="470" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">실제 트래픽에서는 원래 바이너리였던 SNAPSHOT_DELTA(위치 갱신)가 서버→클라 송신의 대부분이라, 서버→클라 총량은 −6%에 그친다.</text>
</svg>

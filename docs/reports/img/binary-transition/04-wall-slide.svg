<svg xmlns="http://www.w3.org/2000/svg" width="900" height="464" viewBox="0 0 900 464" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="키보드 이동 벽 충돌 전후">
<title>키보드 이동 벽 충돌 전후</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="464" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">키보드 이동 벽 충돌 — 뚫고 지나가던 것을 벽을 따라 미끄러지게</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">이동을 X축 → Y축 순서로 나눠 각각 막힘을 검사(축 분리 슬라이드). 서버와 클라 예측이 같은 규칙</text><text x="178" y="92" font-size="14" text-anchor="middle" font-weight="700" fill="#d64545">전 — 벽·맵 경계 검사 없음</text><rect x="24" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="68" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="112" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="156" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="200" y="104" width="44" height="44" rx="0" fill="#3e4c59" stroke="#e4e7eb" stroke-width="1"/><rect x="244" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="288" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="24" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="68" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="112" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="156" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="200" y="148" width="44" height="44" rx="0" fill="#3e4c59" stroke="#e4e7eb" stroke-width="1"/><rect x="244" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="288" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="24" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="68" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="112" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="156" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="200" y="192" width="44" height="44" rx="0" fill="#3e4c59" stroke="#e4e7eb" stroke-width="1"/><rect x="244" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="288" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="24" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="68" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="112" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="156" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="200" y="236" width="44" height="44" rx="0" fill="#3e4c59" stroke="#e4e7eb" stroke-width="1"/><rect x="244" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="288" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="24" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="68" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="112" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="156" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="200" y="280" width="44" height="44" rx="0" fill="#3e4c59" stroke="#e4e7eb" stroke-width="1"/><rect x="244" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="288" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><circle cx="134" cy="258" r="9" fill="#2f6fde"/><line x1="134" y1="258" x2="266" y2="170" stroke="#d64545" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar-bad)"/><text x="322" y="156.8" font-size="13" text-anchor="middle" font-weight="700" fill="#d64545">벽 통과!</text><text x="624" y="92" font-size="14" text-anchor="middle" font-weight="700" fill="#2e9e5b">후 — 축을 나눠 검사 (벽 따라 미끄러짐)</text><rect x="470" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="514" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="558" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="602" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="646" y="104" width="44" height="44" rx="0" fill="#3e4c59" stroke="#e4e7eb" stroke-width="1"/><rect x="690" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="734" y="104" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="470" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="514" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="558" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="602" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="646" y="148" width="44" height="44" rx="0" fill="#3e4c59" stroke="#e4e7eb" stroke-width="1"/><rect x="690" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="734" y="148" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="470" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="514" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="558" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="602" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="646" y="192" width="44" height="44" rx="0" fill="#3e4c59" stroke="#e4e7eb" stroke-width="1"/><rect x="690" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="734" y="192" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="470" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="514" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="558" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="602" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="646" y="236" width="44" height="44" rx="0" fill="#3e4c59" stroke="#e4e7eb" stroke-width="1"/><rect x="690" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="734" y="236" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="470" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="514" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="558" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="602" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="646" y="280" width="44" height="44" rx="0" fill="#3e4c59" stroke="#e4e7eb" stroke-width="1"/><rect x="690" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><rect x="734" y="280" width="44" height="44" rx="0" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/><circle cx="580" cy="258" r="9" fill="#2f6fde"/><line x1="580" y1="258" x2="644" y2="215.33333333333334" stroke="#2e9e5b" stroke-width="2.5"/><line x1="644" y1="215.33333333333334" x2="644" y2="170" stroke="#2e9e5b" stroke-width="2.5" marker-end="url(#ar-good)"/><circle cx="644" cy="215.33333333333334" r="3.5" fill="#2e9e5b"/><text x="636" y="288" font-size="11" text-anchor="end" font-weight="400" fill="#2e9e5b">① 닿기 전: 대각선 그대로</text><text x="636" y="197.33333333333334" font-size="11" text-anchor="end" font-weight="400" fill="#2e9e5b">② 닿은 뒤: X 막힘, Y만</text><text x="636" y="211.33333333333334" font-size="11" text-anchor="end" font-weight="400" fill="#2e9e5b">→ 벽 따라 미끄러짐</text><rect x="24" y="342" width="852" height="104" rx="6" fill="#f5f7fa"/><text x="40" y="424" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">· 한 tick(보폭 0.2칸) 안에서 X를 먼저 움직이고(막히면 벽 앞에서 멈춤) 그다음 Y — 그래서 벽에 닿은 뒤엔 Y만 남는다</text><text x="40" y="364" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">· 벽 앞 1/1024 칸에서 멈춤, 대각선 모서리 틈은 못 지나감(A* 경로와 같은 규칙), 맵 밖은 벽으로 취급</text><text x="40" y="384" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">· 좌표를 1/4096 격자로 맞춰 서버(f64)·클라(f32) 계산이 셀 경계에서 갈라지지 않게 함 (리뷰가 잡은 HIGH)</text><text x="40" y="404" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">· 저장 좌표가 벽 안이면 입장 시 가장 가까운 빈 칸으로 보정. 몬스터 벽 충돌은 후속 과제</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="GC 샘플러 개념도">
<title>GC 샘플러 개념도</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="340" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">왜 GC가 1/10 이하로 줄었나 — 1.3.x의 이벤트 루프 GC 샘플러</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">개념도(500 ms 구간) · 1.3.13 줄은 샘플러의 이론상 최대(16 ms마다 = 초당 62.5회) — 실측 평균은 초당 약 38회(monolith)·50회(월드), 1.4.3은 약 3회</text><text x="300" y="86" font-size="11" text-anchor="start" font-weight="400" fill="#52606d">눈금 = tick 50 ms · 막대 = eden 수집</text><text x="24" y="114" font-size="13.5" text-anchor="start" font-weight="700" fill="#1f2933">Bun 1.3.13</text><text x="24" y="132" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">루프가 바쁘면 16 ms마다 다시 GC 예약</text><line x1="300" y1="120" x2="860" y2="120" stroke="#e4e7eb" stroke-width="2"/><line x1="300" y1="114" x2="300" y2="126" stroke="#7b8794" stroke-width="1"/><text x="300" y="142" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">0ms</text><line x1="356" y1="114" x2="356" y2="126" stroke="#7b8794" stroke-width="1"/><line x1="412" y1="114" x2="412" y2="126" stroke="#7b8794" stroke-width="1"/><text x="412" y="142" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">100ms</text><line x1="468" y1="114" x2="468" y2="126" stroke="#7b8794" stroke-width="1"/><line x1="524" y1="114" x2="524" y2="126" stroke="#7b8794" stroke-width="1"/><text x="524" y="142" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">200ms</text><line x1="580" y1="114" x2="580" y2="126" stroke="#7b8794" stroke-width="1"/><line x1="636" y1="114" x2="636" y2="126" stroke="#7b8794" stroke-width="1"/><text x="636" y="142" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">300ms</text><line x1="692" y1="114" x2="692" y2="126" stroke="#7b8794" stroke-width="1"/><line x1="748" y1="114" x2="748" y2="126" stroke="#7b8794" stroke-width="1"/><text x="748" y="142" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">400ms</text><line x1="804" y1="114" x2="804" y2="126" stroke="#7b8794" stroke-width="1"/><line x1="860" y1="114" x2="860" y2="126" stroke="#7b8794" stroke-width="1"/><text x="860" y="142" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">500ms</text><rect x="306.96" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="324.88" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="342.8" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="360.72" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="378.64" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="396.56" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="414.48" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="432.4" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="450.32000000000005" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="468.24" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="486.16" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="504.08" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="522" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="539.92" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="557.84" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="575.76" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="593.6800000000001" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="611.6" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="629.52" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="647.44" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="665.36" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="683.28" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="701.2" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="719.12" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="737.04" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="754.96" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="772.88" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="790.8" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="808.72" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="826.64" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><rect x="844.56" y="106" width="4" height="28" rx="1" fill="#a3acb9"/><text x="24" y="179" font-size="13.5" text-anchor="start" font-weight="700" fill="#1f2933">Bun 1.4.3</text><text x="24" y="197" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">할당 예산이 찰 때 + GC 페이서(측정 당시 8 tick마다)</text><line x1="300" y1="185" x2="860" y2="185" stroke="#e4e7eb" stroke-width="2"/><line x1="300" y1="179" x2="300" y2="191" stroke="#7b8794" stroke-width="1"/><text x="300" y="207" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">0ms</text><line x1="356" y1="179" x2="356" y2="191" stroke="#7b8794" stroke-width="1"/><line x1="412" y1="179" x2="412" y2="191" stroke="#7b8794" stroke-width="1"/><text x="412" y="207" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">100ms</text><line x1="468" y1="179" x2="468" y2="191" stroke="#7b8794" stroke-width="1"/><line x1="524" y1="179" x2="524" y2="191" stroke="#7b8794" stroke-width="1"/><text x="524" y="207" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">200ms</text><line x1="580" y1="179" x2="580" y2="191" stroke="#7b8794" stroke-width="1"/><line x1="636" y1="179" x2="636" y2="191" stroke="#7b8794" stroke-width="1"/><text x="636" y="207" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">300ms</text><line x1="692" y1="179" x2="692" y2="191" stroke="#7b8794" stroke-width="1"/><line x1="748" y1="179" x2="748" y2="191" stroke="#7b8794" stroke-width="1"/><text x="748" y="207" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">400ms</text><line x1="804" y1="179" x2="804" y2="191" stroke="#7b8794" stroke-width="1"/><line x1="860" y1="179" x2="860" y2="191" stroke="#7b8794" stroke-width="1"/><text x="860" y="207" font-size="9.5" text-anchor="middle" font-weight="400" fill="#7b8794">500ms</text><rect x="488.4" y="171" width="4" height="28" rx="1" fill="#2f6fde"/><rect x="746" y="171" width="4" height="28" rx="1" fill="#2f6fde"/><text x="748" y="222" font-size="10" text-anchor="middle" font-weight="400" fill="#2f6fde">페이서</text><rect x="24" y="230" width="852" height="92" rx="6" fill="#f5f7fa"/><text x="40" y="252" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">1.3.x는 이벤트 루프가 돌 때마다 힙을 재서, 값이 바뀌었으면 16 ms 뒤 GC를 다시 걸었다 — 루프가 계속 바쁘면 할당량과 무관하게</text><text x="40" y="270" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">eden이 최대 초당 ≈62.5회까지 이어진다(PR #35356, 1.4.0에서 제거). 20 Hz tick + 상시 소켓 I/O인 이 서버가 정확히 그 조건이었다.</text><text x="40" y="292" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">그래서 이진 전환(B2b·B3b·B6)으로 JSON을 걷어내도 월드 eden 횟수가 줄지 않았던 것으로 보인다 — 런타임만 바꾸자 1/10 이하가 됐다.</text><text x="40" y="310" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">1.4.2(샘플러 없음, 1.4.3의 메모리 집계 수정도 없음)에서도 같은 감소 → 1.4.0~1.4.2 변경이 유력 원인이다(할당기 교체와는 미분리).</text>
</svg>

="15" rx="2" fill="#2f6fde"/><text x="599.1428571428571" y="592" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">119 MB</text><text x="814" y="585" font-size="17" text-anchor="end" font-weight="700" fill="#52606d">−11%</text><text x="822" y="585" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">참고값</text>

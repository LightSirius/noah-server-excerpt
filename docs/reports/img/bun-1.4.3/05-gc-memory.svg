<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">GC(메모리 청소)와 메모리 — 런 1회(≈45–51 s, 램프 포함)</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">GC 로그 런 2쌍 평균 · eden = 짧은 청소, full = 전체 청소 · 힙·RSS는 런타임 계정이 바뀌어 참고값</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#a3acb9"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">Bun 1.3.13 (마지막 기준)</text><rect x="203.51999999999998" y="70" width="12" height="12" rx="2" fill="#2f6fde"/><text x="220.51999999999998" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">Bun 1.4.3</text><text x="24" y="120" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">eden 수집 횟수</text><line x1="24" y1="127" x2="896" y2="127" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="151" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">monolith 700명</text><rect x="254" y="139" width="251.85185185185185" height="15" rx="2" fill="#a3acb9"/><text x="511.85185185185185" y="151" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">1,700회</text><rect x="254" y="158" width="22" height="15" rx="2" fill="#2f6fde"/><text x="282" y="170" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">149회</text><text x="814" y="163" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−91%</text><text x="24" y="201" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">월드 · 1200명</text><text x="24" y="218" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">1.3.13은 하한(로그 섞임)</text><rect x="254" y="189" width="374.8888888888889" height="15" rx="2" fill="#a3acb9"/><text x="634.8888888888889" y="201" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">2,531회</text><rect x="254" y="208" width="24.666666666666686" height="15" rx="2" fill="#2f6fde"/><text x="284.6666666666667" y="220" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">167회</text><text x="814" y="213" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−93%</text><text x="24" y="251" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">게이트웨이 1개 평균 · 1200명</text><rect x="254" y="239" width="362.07407407407413" height="15" rx="2" fill="#a3acb9"/><text x="622.0740740740741" y="251" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">2,444회</text><rect x="254" y="258" width="16.444444444444457" height="15" rx="2" fill="#2f6fde"/><text x="276.44444444444446" y="270" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">111회</text><text x="814" y="263" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−95%</text><text x="24" y="306" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">full 수집 횟수</text><line x1="24" y1="313" x2="896" y2="313" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="337" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">monolith 700명</text><rect x="254" y="325" width="243.75" height="15" rx="2" fill="#a3acb9"/><text x="503.75" y="337" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">19.5회</text><rect x="254" y="344" width="193.75" height="15" rx="2" fill="#2f6fde"/><text x="453.75" y="356" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">15.5회</text><text x="814" y="349" font-size="17" text-anchor="end" font-weight="700" fill="#2e9e5b">−21%</text><text x="24" y="387" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">월드 · 1200명</text><rect x="254" y="375" width="350" height="15" rx="2" fill="#a3acb9"/><text x="610" y="387" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">28회</text><rect x="254" y="394" width="256.25" height="15" rx="2" fill="#2f6fde"/><text x="516.25" y="406" font-size="11.5" text-anchor="start" font-weight="700" fill="#2f6fde">20.5회</text><text x
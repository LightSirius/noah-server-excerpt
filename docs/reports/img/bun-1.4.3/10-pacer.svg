<svg xmlns="http://www.w3.org/2000/svg" width="920" height="726" viewBox="0 0 920 726" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="GC 페이서 재튜닝">
<title>GC 페이서 재튜닝</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="920" height="726" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">GC 페이서 재튜닝 — 1.4.3에서 몇 tick마다 GC를 요청할까</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">서버 1.4.3 · 부하 생성기 1.3.13 · K = 몇 tick마다 GC를 미리 요청하나(0 = 끔) · 막대 = 중앙값(짧을수록 좋음, 묶음마다 눈금 다름)</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#a3acb9"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">K=0 (끔 — 새 기본)</text><rect x="166.8" y="70" width="12" height="12" rx="2" fill="#2f6fde"/><text x="183.8" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">K=8 (측정 당시 기본)</text><rect x="317.15999999999997" y="70" width="12" height="12" rx="2" fill="#8e44ad"/><text x="334.15999999999997" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">K=16</text><text x="24" y="120" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">벤치 — zoneBench 1150명 (전환 전 페이서 측정과 같은 조건)</text><line x1="24" y1="127" x2="896" y2="127" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="151" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">tick p99 — 1회차 (3회)</text><rect x="300" y="136" width="166.992" height="11" rx="2" fill="#a3acb9"/><text x="472.99199999999996" y="146" font-size="10.5" text-anchor="start" font-weight="700" fill="#a3acb9">9.94 ms</text><rect x="300" y="150" width="266.28000000000003" height="11" rx="2" fill="#2f6fde"/><text x="572.28" y="160" font-size="10.5" text-anchor="start" font-weight="700" fill="#2f6fde">15.85 ms</text><rect x="300" y="164" width="160.44" height="11" rx="2" fill="#8e44ad"/><text x="466.44" y="174" font-size="10.5" text-anchor="start" font-weight="700" fill="#8e44ad">9.55 ms</text><text x="24" y="201" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">2회차 (4회, 호스트 바쁨)</text><text x="24" y="218" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">K=16은 재지 않음</text><text x="300" y="201" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">중앙값 끔 16.34 · 켬 14.67 ms — 이웃한 끔/켬 쌍은 끔 낮음 2 · 켬 낮음 1 · 같음 1</text><text x="24" y="250" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">실서버 monolith 850명 (3회)</text><line x1="24" y1="257" x2="896" y2="257" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="281" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">tick p99</text><rect x="300" y="266" width="314.055" height="11" rx="2" fill="#a3acb9"/><text x="620.0550000000001" y="276" font-size="10.5" text-anchor="start" font-weight="700" fill="#a3acb9">29.91 ms</text><rect x="300" y="280" width="323.085" height="11" rx="2" fill="#2f6fde"/><text x="629.085" y="290" font-size="10.5" text-anchor="start" font-weight="700" fill="#2f6fde">30.77 ms</text><rect x="300" y="294" width="316.26" height="11" rx="2" fill="#8e44ad"/><text x="622.26" y="304" font-size="10.5" text-anchor="start" font-weight="700" fill="#8e44ad">30.12 ms</text><text x="24" y="331" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">tick 평균</text><text x="24" y="348" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">flush가 정하는 경계 — 페이서와 무관</text><rect x="300" y="316" width="240.87" height="11" rx="2" fill="#a3acb9"/><text x="546.87" y="326" font-size="10.5" text-anchor="start" font-weight="700" fill="#a3acb9">22.94 ms</text><rect x="300" y="330" width="239.61" height="11" rx="2" fill="#2f6fde"/><text x="545.61" y="340" font-size="10.5" text-anchor="start" font-weight="700" fill="#2f6fde">22.82 ms</text><rect x="300" y="344" width="242.44500000000002" height="11" rx="2" fill="#8e44ad"/><text x="548.445" y="354" font-size="10.5" text-anchor="start" font-weight="700" fill="#8e44ad">23.09 ms</text><text x="24" y="386" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">실서버 게이트웨이 2개 1450명</text><line x1="24" y1="393" x2="896" y2="393" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="417" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">tick p99 — 1회차 (3회)</text><text x="24" y="434" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">이웃 쌍: 끔 낮음 1 · 켬 낮음 1 · 같음 1</text><rect x="300" y="402" width="150.22" height="11" rx="2" fill="#a3acb9"/><text x="456.22" y="412" font-size="10.5" text-anchor="start" font-weight="700" fill="#a3acb9">21.46 ms</text><rect x="300" y="416" width="200.69000000000003" height="11" rx="2" fill="#2f6fde"/><text x="506.69000000000005" y="426" font-size="10.5" text-anchor="start" font-weight="700" fill="#2f6fde">28.67 ms</text><rect x="300" y="430" width="196" height="11" rx="2" fill="#8e44ad"/><text x="502" y="440" font-size="10.5" text-anchor="start" font-weight="700" fill="#8e44ad">28.00 ms</text><text x="24" y="467" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">2회차 (4회, 호스트 바쁨)</text><text x="24" y="484" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">K=16은 재지 않음</text><text x="300" y="467" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">이웃 쌍 — 끔 낮음 3 · 켬 낮음 1(그 끔 런은 14.4 Hz로 무너짐) · GC 로그 쌍은 켬 낮음</text><text x="24" y="516" font-size="13.5" text-anchor="start" font-weight="700" fill="#52606d">GC 수집 횟수 (GC 로그 런 1회 — 램프 포함 ≈48–55초)</text><line x1="24" y1="523" x2="896" y2="523" stroke="#e4e7eb" stroke-width="1"/><text x="24" y="547" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">eden — monolith 850명</text><rect x="300" y="532" width="132.3" height="11" rx="2" fill="#a3acb9"/><text x="438.3" y="542" font-size="10.5" text-anchor="start" font-weight="700" fill="#a3acb9">63회</text><rect x="300" y="546" width="325.5" height="11" rx="2" fill="#2f6fde"/><text x="631.5" y="556" font-size="10.5" text-anchor="start" font-weight="700" fill="#2f6fde">155회</text><rect x="300" y="560" width="212.1" height="11" rx="2" fill="#8e44ad"/><text x="518.1" y="570" font-size="10.5" text-anchor="start" font-weight="700" fill="#8e44ad">101회</text><text x="24" y="597" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">eden — 월드 (게이트웨이 2개 1450명)</text><text x="24" y="614" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">full은 거의 같음 (16·16·17 / 25·23)</text><rect x="300" y="582" width="140.70000000000002" height="11" rx="2" fill="#a3acb9"/><text x="446.70000000000005" y="592" font-size="10.5" text-anchor="start" font-weight="700" fill="#a3acb9">67회</text><rect x="300" y="596" width="386.40000000000003" height="11" rx="2" fill="#2f6fde"/><text x="692.4000000000001" y="606" font-size="10.5" text-anchor="start" font-weight="700" fill="#2f6fde">184회</text><rect x="24" y="636" width="872" height="76" rx="6" fill="#f5f7fa"/><text x="40" y="656" font-size="12" text-anchor="start" font-weight="700" fill="#1f2933">결론: 1.4.3에서는 페이서 이득이 측정되지 않아 기본값을 8 → 0(끔)으로 바꿨다 (GC_PACE_TICKS=8로 다시 켤 수 있다).</text><text x="40" y="674" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">벤치는 회차마다 방향이 엇갈리고 monolith는 같고, 게이트웨이 구성도 켜서 나아지지 않았다. 켜 두면 eden 수집만 2.5~2.7배가 된다.</text><text x="40" y="692" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">1.3.13 벤치(1회씩)는 켠 쪽이 낮다(p99 끔 15.75 · 켬 13.92 ms, 참고값) — 페이서가 막던 tick 안 GC는 1.3.x GC 샘플러에서 온 것으로 보인다.</text>
</svg>

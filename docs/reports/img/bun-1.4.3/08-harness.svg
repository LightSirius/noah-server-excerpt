<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" viewBox="0 0 900 312" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="하네스 교훈">
<title>하네스 교훈</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="312" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">측정 도구 교훈 — 서버 스레드 수는 "처음 본 CPU 수"로 정해진다</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">pinmon이 런타임 초기화보다 먼저 CPU를 묶으면 GC 마커·작업 스레드가 줄어든다(두 버전 모두 발생 — 3회) · 개념도</text><text x="24" y="110" font-size="13" text-anchor="start" font-weight="700" fill="#2e9e5b">보통 (경합 없음)</text><line x1="230" y1="106" x2="830" y2="106" stroke="#e4e7eb" stroke-width="2"/><rect x="230" y="96" width="104" height="20" rx="3" fill="#dbe7fb"/><text x="290" y="110" font-size="10.5" text-anchor="middle" font-weight="400" fill="#1f2933">런타임 초기화</text><line x1="470" y1="90" x2="470" y2="122" stroke="#2e9e5b" stroke-width="2.2"/><text x="476" y="86" font-size="10.5" text-anchor="start" font-weight="700" fill="#2e9e5b">pinmon 고정 (600 ms)</text><text x="830" y="136" font-size="11" text-anchor="end" font-weight="400" fill="#52606d">초기화 때 CPU 6개(부하 생성기에서 물려받음)가 보임 → GC 마커(HeapHelper) 5 · 작업 풀 6</text><text x="24" y="174" font-size="13" text-anchor="start" font-weight="700" fill="#d64545">경합 (드물게)</text><line x1="230" y1="170" x2="830" y2="170" stroke="#e4e7eb" stroke-width="2"/><rect x="230" y="160" width="104" height="20" rx="3" fill="#dbe7fb"/><text x="290" y="174" font-size="10.5" text-anchor="middle" font-weight="400" fill="#1f2933">런타임 초기화</text><line x1="254" y1="154" x2="254" y2="186" stroke="#d64545" stroke-width="2.2"/><text x="260" y="150" font-size="10.5" text-anchor="start" font-weight="700" fill="#d64545">pinmon 고정 (60 ms)</text><text x="830" y="200" font-size="11" text-anchor="end" font-weight="400" fill="#52606d">초기화 때 CPU 2개만 보임 → HeapHelper 1 · 작업 풀 2 → 로그인(bcrypt) 지연·인증 전 끊김</text><rect x="24" y="222" width="852" height="74" rx="6" fill="#f5f7fa"/><text x="40" y="244" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">조치: pinmon이 뜬 지 1초가 안 된 프로세스는 고정하지 않게 고쳤고(PINMON_MIN_AGE_S), pincheck가 서버별 HeapHelper 수를 검사한다.</text><text x="40" y="264" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">운영은 CPU를 고정하지 않아 무관하지만, 컨테이너 cpuset처럼 허용 CPU가 적으면 bcrypt 동시 처리량·GC 마커 수가 그만큼 준다.</text><text x="40" y="284" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">다른 교훈: 런타임 비교는 부하 생성기 bun을 고정한다(부하 생성기 런타임이 바뀌면 monolith flush가 13 → 17 ms로 움직인다).</text>
</svg>

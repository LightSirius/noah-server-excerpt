<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="원인 분리">
<title>원인 분리</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="452" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">원인 분리 — 1.4.2(샘플러 없음 · 1.4.3 집계 수정 없음)도 eden이 거의 같다</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">런 1회 수집 횟수(GC 로그, 평균) · 1.3.13·1.4.3은 4.2와 같은 본 측정 값 · 1.4.2는 별도 묶음(횟수만 사용)</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#a3acb9"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">1.3.13</text><rect x="103.32" y="70" width="12" height="12" rx="2" fill="#8e44ad"/><text x="120.32" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">1.4.2</text><rect x="175.92" y="70" width="12" height="12" rx="2" fill="#2f6fde"/><text x="192.92" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">1.4.3</text><text x="24" y="126" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">monolith eden</text><rect x="250" y="100" width="442" height="13" rx="2" fill="#a3acb9"/><text x="698" y="111" font-size="11" text-anchor="start" font-weight="700" fill="#52606d">1,700</text><rect x="250" y="116" width="38.61" height="13" rx="2" fill="#8e44ad"/><text x="294.61" y="127" font-size="11" text-anchor="start" font-weight="700" fill="#8e44ad">149</text><rect x="250" y="132" width="38.61" height="13" rx="2" fill="#2f6fde"/><text x="294.61" y="143" font-size="11" text-anchor="start" font-weight="700" fill="#2f6fde">149</text><text x="24" y="190" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">월드 eden</text><rect x="250" y="164" width="469.95000000000005" height="13" rx="2" fill="#a3acb9"/><text x="725.95" y="175" font-size="11" text-anchor="start" font-weight="700" fill="#52606d">2,531</text><rect x="250" y="180" width="34.45" height="13" rx="2" fill="#8e44ad"/><text x="290.45" y="191" font-size="11" text-anchor="start" font-weight="700" fill="#8e44ad">186</text><rect x="250" y="196" width="30.92142857142857" height="13" rx="2" fill="#2f6fde"/><text x="286.9214285714286" y="207" font-size="11" text-anchor="start" font-weight="700" fill="#2f6fde">167</text><text x="24" y="254" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">게이트웨이 eden (1개 평균)</text><rect x="250" y="228" width="453.8857142857143" height="13" rx="2" fill="#a3acb9"/><text x="709.8857142857144" y="239" font-size="11" text-anchor="start" font-weight="700" fill="#52606d">2,444</text><rect x="250" y="244" width="18.942857142857143" height="13" rx="2" fill="#8e44ad"/><text x="274.9428571428571" y="255" font-size="11" text-anchor="start" font-weight="700" fill="#8e44ad">102</text><rect x="250" y="260" width="20.614285714285714" height="13" rx="2" fill="#2f6fde"/><text x="276.6142857142857" y="271" font-size="11" text-anchor="start" font-weight="700" fill="#2f6fde">111</text><text x="24" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">게이트웨이 full (1개 평균)</text><rect x="250" y="292" width="152.75" height="13" rx="2" fill="#a3acb9"/><text x="408.75" y="303" font-size="11" text-anchor="start" font-weight="700" fill="#52606d">12</text><rect x="250" y="308" width="461.5" height="13" rx="2" fill="#8e44ad"/><text x="717.5" y="319" font-size="11" text-anchor="start" font-weight="700" fill="#8e44ad">36</text><rect x="250" y="324" width="35.75" height="13" rx="2" fill="#2f6fde"/><text x="291.75" y="335" font-size="11" text-anchor="start" font-weight="700" fill="#2f6fde">3</text><rect x="24" y="360" width="852" height="74" rx="6" fill="#f5f7fa"/><text x="40" y="382" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">· eden 감소는 1.4.2에 이미 있다 → 1.4.3에만 들어간 메모리 집계 수정(WebKit#684)은 eden 감소의 원인이 아니다.</text><text x="40" y="402" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">· #684의 효과는 게이트웨이 full에서 보인다(1.4.2 32–40 → 1.4.3 2–4회) — 버퍼를 많이 쓰는 게이트웨이의 메모리 집계가 바로잡혔다.</text><text x="40" y="422" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">· 1.4.0~1.4.2 안에서 샘플러 제거와 할당기 교체(mimalloc) 등을 더 가르지는 않았다 → 그래서 "유력 원인"이다.</text>
</svg>

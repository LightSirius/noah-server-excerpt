<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="측정 방법">
<title>측정 방법</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="330" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">어떻게 쟀나 — 서버 런타임만 바꾸고 나머지는 고정</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">같은 커밋·같은 체크아웃·같은 CPU 배치, A·B 순서 교차 · 부하 생성기는 언제나 Bun 1.3.13</text><rect x="24" y="86" width="250" height="96" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.3"/><text x="149" y="122" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2933">부하 생성기 (봇 700·1,150·1,200명)</text><text x="149" y="139" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">오케스트레이터 + 샤드</text><text x="149" y="156" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">Bun 1.3.13 고정 · CPU 0,1,8–11</text><rect x="330" y="86" width="250" height="96" rx="8" fill="#e8f0fd" stroke="#2f6fde" stroke-width="1.3"/><text x="455" y="122" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2933">서버 (monolith 또는 월드)</text><text x="455" y="139" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">--server-bun 으로 선택</text><text x="455" y="156" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">A = 1.3.13 · B = 1.4.3 · CPU 2,3</text><rect x="636" y="86" width="240" height="96" rx="8" fill="#e8f0fd" stroke="#2f6fde" stroke-width="1.3"/><text x="756" y="122" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2933">게이트웨이 2개 (확장 구성)</text><text x="756" y="139" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">슈퍼바이저의 bun을 물려받음</text><text x="756" y="156" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52606d">CPU 4,5 / 6,7</text><line x1="274" y1="134" x2="326" y2="134" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar-ink)"/><line x1="580" y1="134" x2="632" y2="134" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar-ink)"/><rect x="24" y="200" width="852" height="112" rx="6" fill="#f5f7fa"/><text x="40" y="222" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">· 부하 생성기를 고정한 이유: 부하 생성기까지 1.4.3이면 monolith의 소켓 쓰기(flush)가 13 → 17 ms로 바뀐다(같은 PC 안 수신 측 동작).</text><text x="40" y="242" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">· 정상 확인: A·B의 부하 생성기 CPU·주고받은 바이트가 같았다 — 부하는 같고 서버 런타임만 다르다.</text><text x="40" y="262" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">· CPU 고정 확인: 런마다 프로세스가 정해진 CPU에 있었는지 검사했다(핀 이탈 0). 스레드 수 검사는 측정 뒤 추가했고 런 1개가 걸렸다(6장).</text><text x="40" y="282" font-size="12" text-anchor="start" font-weight="400" fill="#1f2933">· 시나리오 spread: 봇이 맵에 고르게 퍼져 계속 이동, 조인 초당 100명, 측정 창 30초 — 24런 모두 20 Hz를 유지했다.</text><text x="40" y="302" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">· 기능: 전체 시험(Windows·Linux)과 실소켓·IPC 동작 프로브를 두 버전에서 비교했다.</text>
</svg>

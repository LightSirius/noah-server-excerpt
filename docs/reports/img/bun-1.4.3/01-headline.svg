<svg xmlns="http://www.w3.org/2000/svg" width="900" height="698" viewBox="0 0 900 698" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="Bun 1.3.13 → 1.4.3 — 무엇이 얼마나 바뀌었나">
<title>Bun 1.3.13 → 1.4.3 — 무엇이 얼마나 바뀌었나</title>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8890c"/></marker></defs>
<rect x="0" y="0" width="900" height="698" rx="0" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">Bun 1.3.13 → 1.4.3 — 무엇이 얼마나 바뀌었나</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">같은 코드(B6 이후)·같은 CPU 배치에서 서버 런타임만 바꿈 · 시간·CPU는 중앙값, GC는 2쌍 평균 · eden 막대만 눈금 밖이라 끊어 그림</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#2e9e5b"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">좋아짐</text><rect x="96.48" y="70" width="12" height="12" rx="2" fill="#ffffff" stroke="#7b8794" stroke-width="1.4" stroke-dasharray="3 2"/><text x="113.48" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">차이 단정 불가 · 참고값</text><line x1="610" y1="100" x2="610" y2="682" stroke="#7b8794" stroke-width="1"/><text x="24" y="114" font-size="12.5" text-anchor="start" font-weight="700" fill="#52606d">수용 인원 (tick p99 25 ms 교차점 — 클수록 좋음)</text><text x="24" y="139" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">monolith (서버 1개)</text><text x="24" y="155" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">≈756 → ≈776명 · 소켓 송신(커널)이 한계라 사실상 그대로</text><rect x="595" y="130" width="15" height="20" rx="2" fill="#ffffff" stroke="#7b8794" stroke-width="1.4" stroke-dasharray="3 2"/><text x="587" y="145" font-size="14" text-anchor="end" font-weight="700" fill="#52606d">+3% (편차 안)</text><text x="24" y="181" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">게이트웨이 2개 구성</text><text x="24" y="197" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">≈1,227 → ≈1,621명 · 측정 PC가 한가할 때 기준</text><rect x="475" y="172" width="135" height="20" rx="2" fill="#2e9e5b"/><text x="467" y="187" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">+20~32%</text><text x="24" y="222" font-size="12.5" text-anchor="start" font-weight="700" fill="#52606d">CPU (같은 부하)</text><text x="24" y="247" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">monolith 서버 CPU</text><text x="24" y="263" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">0.61 → 0.47 코어 (700명)</text><rect x="495" y="238" width="115" height="20" rx="2" fill="#2e9e5b"/><text x="487" y="253" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−23%</text><text x="24" y="289" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">월드 CPU (게이트웨이 2개 구성)</text><text x="24" y="305" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">0.68–0.71 → 0.40–0.42 코어 (1150·1200명)</text><rect x="405" y="280" width="205" height="20" rx="2" fill="#2e9e5b"/><text x="397" y="295" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−41%</text><text x="24" y="331" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">게이트웨이 CPU (2개 합)</text><text x="24" y="347" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">0.90–0.93 → 0.74 코어</text><rect x="515" y="322" width="95" height="20" rx="2" fill="#2e9e5b"/><text x="507" y="337" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−18~20%</text><text x="24" y="372" font-size="12.5" text-anchor="start" font-weight="700" fill="#52606d">tick (서버 갱신 1회 시간)</text><text x="24" y="397" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">tick 평균 — 게이트웨이 2개 구성</text><text x="24" y="413" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">13.96 → 10.59 ms (1150명) · 1200명도 −24%</text><rect x="490" y="388" width="120" height="20" rx="2" fill="#2e9e5b"/><text x="482" y="403" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−24%</text><text x="24" y="439" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">tick p99 — 게이트웨이 2개 구성</text><text x="24" y="455" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">22.88 → 16.26 (1150명) · 24.86* → 19.09 ms (1200명, *경합 런 — 본문 6장)</text><rect x="480" y="430" width="130" height="20" rx="2" fill="#2e9e5b"/><text x="472" y="445" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−23~29%</text><text x="24" y="481" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">tick 평균·p99 — monolith 700명</text><text x="24" y="497" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">18.56 → 16.79 · 24.57 → 22.05 ms (봇 1.3.13 고정 조건, p99 범위 살짝 겹침)</text><rect x="560" y="472" width="50" height="20" rx="2" fill="#2e9e5b"/><text x="552" y="487" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−10%</text><text x="24" y="522" font-size="12.5" text-anchor="start" font-weight="700" fill="#52606d">GC · 메모리</text><text x="24" y="547" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">eden(짧은 청소) 수집 횟수</text><text x="24" y="563" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">런당 monolith ≈1,700 → ≈150 · 월드 ≈2,530 → ≈167</text><rect x="330" y="538" width="280" height="20" rx="2" fill="#2e9e5b"/><line x1="332" y1="560" x2="338" y2="536" stroke="#ffffff" stroke-width="2"/><line x1="337" y1="560" x2="343" y2="536" stroke="#ffffff" stroke-width="2"/><text x="348" y="553" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff">−91~95%</text><text x="24" y="589" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">유휴 메모리 (RSS)</text><text x="24" y="605" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">91–94 → 59–61 MB · 집계 방식 변경, 참고값</text><rect x="430" y="580" width="180" height="20" rx="2" fill="#ffffff" stroke="#7b8794" stroke-width="1.4" stroke-dasharray="3 2"/><text x="422" y="595" font-size="14" text-anchor="end" font-weight="700" fill="#52606d">−36% (참고)</text><text x="24" y="630" font-size="12.5" text-anchor="start" font-weight="700" fill="#52606d">봇이 잰 지연 (같은 PC 안 봇 기준)</text><text x="24" y="655" font-size="13" text-anchor="start" font-weight="400" fill="#1f2933">왕복 지연 rtt99</text><text x="24" y="671" font-size="11" text-anchor="start" font-weight="400" fill="#7b8794">monolith 25.0 → 19.8 · 게이트웨이 2개 31.7 → 22.2 ms</text><rect x="480" y="646" width="130" height="20" rx="2" fill="#2e9e5b"/><text x="472" y="661" font-size="14" text-anchor="end" font-weight="700" fill="#2e9e5b">−21~30%</text>
</svg>

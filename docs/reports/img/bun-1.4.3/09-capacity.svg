<text x="24" y="34" font-size="19" text-anchor="start" font-weight="700" fill="#1f2933">수용 인원 — tick p99가 25 ms를 넘는 지점</text><text x="24" y="56" font-size="12.5" text-anchor="start" font-weight="400" fill="#52606d">레벨별 중앙값(점)·런별 최소~최대(세로선) · 교차점(세로 눈금선)은 오전 중앙값 사이 보간 · 실선 = 오전(호스트 한가) · 파선 = 오후 한 묶음(호스트 바쁨)</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#a3acb9"/><text x="41" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">Bun 1.3.13 (마지막 기준)</text><rect x="203.51999999999998" y="70" width="12" height="12" rx="2" fill="#2f6fde"/><text x="220.51999999999998" y="80" font-size="12" text-anchor="start" font-weight="400" fill="#52606d">Bun 1.4.3</text><text x="70" y="108" font-size="13.5" text-anchor="start" font-weight="700" fill="#1f2933">monolith (서버 1개)</text><line x1="70" y1="370" x2="410" y2="370" stroke="#e4e7eb" stroke-width="1"/><text x="64" y="374" font-size="10.5" text-anchor="end" font-weight="400" fill="#7b8794">10</text><line x1="70" y1="307.5" x2="410" y2="307.5" stroke="#e4e7eb" stroke-width="1"/><text x="64" y="311.5" font-size="10.5" text-anchor="end" font-weight="400" fill="#7b8794">20</text><line x1="70" y1="276.25" x2="410" y2="276.25" stroke="#e4e7eb" stroke-width="1"/><text x="64" y="280.25" font-size="10.5" text-anchor="end" font-weight="400" fill="#7b8794">25</text><line x1="70" y1="245" x2="410" y2="245" stroke="#e4e7eb" stroke-width="1"/><text x="64" y="249" font-size="10.5" text-anchor="end" font-weight="400" fill="#7b8794">30</text><line x1="70" y1="182.5" x2="410" y2="182.5" stroke="#e4e7eb" stroke-width="1"/><text x="64" y="186.5" font-size="10.5" text-anchor="end" font-weight="400" fill="#7b8794">40</text><line x1="70" y1="120" x2="410" y2="120" stroke="#e4e7eb" stroke-width="1"/><text x="64" y="124" font-size="10.5" text-anchor="end" font-weight="400" fill="#7b8794">50</text><text x="70" y="386" font-size="10.5" text-anchor="middle" font-weight="400" fill="#7b8794">600</text><text x="167.142857142
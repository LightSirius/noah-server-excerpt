text x="514" y="302.57142857142856" font-size="10.5" text-anchor="end" font-weight="400" fill="#7b8794">30</text><line x1="520" y1="262.8571428571429" x2="860" y2="262.8571428571429" stroke="#e4e7eb" stroke-width="1"/><text x="514" y="266.8571428571429" font-size="10.5" text-anchor="end" font-weight="400" fill="#7b8794">40</text><line x1="520" y1="191.42857142857142" x2="860" y2="191.42857142857142" stroke="#e4e7eb" stroke-width="1"/><text x="514" y="195.42857142857142" font-size="10.5" text-anchor="end" font-weight="400" fill="#7b8794">60</text><line x1="520" y1="120" x2="860" y2="120" stroke="#e4e7eb" stroke-width="1"/><text x="514" y="124" font-size="10.5" text-anchor="end" font-weight="400" fill="#7b8794">80</text><text x="537" y="386" font-size="10.5" text-anchor="middle" font-weight="400" fill="#7b8794">1100</text><text x="605" y="386" font-size="10.5" text-anchor="middle" font-weight="400" fill="#7b8794">1300</text><text x="673" y="386" font-size="10.5" text-anchor="middle" font-weight="400" fill="#7b8794">1500</text><text x="741" y="386" font-size="10.5" text-anchor="middle" font-weight="400" fill="#7b8794">1700</text><text x="809" y="386" font-size="10.5" text-anchor="middle" font-weight="400" fill="#7b8794">1900</text><line x1="520" y1="370" x2="860" y2="370" stroke="#7b8794" stroke-width="1"/><line x1="520" y1="120" x2="520" y2="370" stroke="#7b8794" stroke-width="1"/><text x="690" y="402" font-size="11" text-anchor="middle" font-weight="400" fill="#52606d">동시 접속(명)</text><text x="860" y="108" font-size="11" text-anchor="end" font-weight="400" fill="#52606d">tick p99 (ms)</text><line x1="520" y1="316.42857142857144" x2="860" y2="316.42857142857144" stroke="#d64545" stroke-width="1.4" stroke-dasharray="5 4"/><text x="856" y="311.42857142857144" font-size="10.5" text-anchor="end" font-weight="400" fill="#d64545">25 ms</text><line x1="537" y1="355.07142857142856" x2="537" y2="338.82142857142856" stroke="#a3acb9" stroke-width="1.2"/><line x1="554" y1="353.07142857142856" x2="554" y2="312.4642857142857" stroke="#a3acb9" stroke-width="1.2"/><line x1="571" y1="343.0357142857143" x2="571" y2="321.5" stroke="#a3acb9" stroke-width="1.2"/><line x1="588" y1="331.32142857142856" x2="588" y2="281.4642857142857" stroke="#a3acb9" stroke-width="1.2"/><line x1="605" y1="338" x2="605" y2="323.82142857142856" stroke="#a3acb9" stroke-width="1.2"/><path d="M537.0,342.6 L554.0,339.8 L571.0,336.6 L588.0,299.8 L605.0,330.6" fill="none" stroke="#a3acb9" stroke-width="2.2"/><circle cx="537.0" cy="342.6" r="3.2" fill="#a3acb9"/><circle cx="554.0" cy="339.8" r="3.2" fill="#a3acb9"/><circle cx="571.0" cy="336.6" r="3.2" fill="#a3acb9"/><circle cx="588.0" cy="299.8" r="3.2" fill="#a3acb9"/><circle cx="605.0" cy="330.6" r="3.2" fill="#a3acb9"/><line x1="605" y1="353.82142857142856" x2="605" y2="345.82142857142856" stroke="#2f6fde" stroke-width="1.2"/><line x1="639" y1="339.3571428571429" x2="639" y2="331.2142857142857" stroke="#2f6fde" stroke-width="1.2"/><line x1="656" y1="343.92857142857144" x2="656" y2="337.89285714285717" stroke="#2f6fde" stroke-width="1.2"/><line x1="673" y1="340.5357142857143" x2="673" y2="336.67857142857144" stroke="#2f6fde" stroke-width="1.2"/><line x1="707" y1="331.7142857142857" x2="707" y2="322.7857142857143" stroke="#2f6fde" stroke-width="1.2"/><line x1="741" y1="299.6428571428571" x2="741" y2="254.67857142857144" stroke="#2f6fde" stroke-width="1.2"/><line x1="775" y1="286.17857142857144" x2="775" y2="196.82142857142856" stroke="#2f6fde" stroke-width="1.2"/><line x1="809" y1="264.92857142857144" x2="809" y2="159.82142857142858" stroke="#2f6fde" stroke-width="1.2"/><line x1="843" y1="234.96428571428572" x2="843" y2="120" stroke="#2f6fde" stroke-width="1.2"/><path d="M605.0,350.2 L639.0,339.0 L656.0,339.5 L673.0,338.1 L707.0,330.9 L741.0,262.2 L775.0,267.8 L809.0,226.6 L843.0,150.1" fill="none" stroke="#2f6fde" stroke-width="2.2"/><circle cx="605.0" cy="350.2" r="3.2" fill="#2f6fde"/><circle cx="639.0" cy="339.0" r="3.2" fill="#2f6fde"/><circle cx="656.0" cy="339.5" r="3.2" fill="#2f6fde"/><circle cx="673.0" cy="338.1" r="3.2" fill="#2f6fde"/><circle cx="707.0" cy="330.9" r="3.2" fill="#2f6fde"/><circle cx="741.0" cy="262.2" r="3.2" fill="#2f6fde"/><circle cx="775.0" cy="267.8" r="3.2" fill="#2f6fde"/><circle cx="809.0" cy="226.6" r="3.2" fill="#2f6fde"/><circle cx="843.0" cy="150.1" r="3.2" fill="#2f6fde"/><line x1="588" y1="284.3571428571429" x2="588" y2="265.5" stroke="#a3acb9" stroke-width="1.2"/><line x1="605" y1="271.6071428571429" x2="605" y2="120" stroke="#a3acb9" stroke-width="1.2"/><line x1="622" y1="249.96428571428572" x2="622" y2="160.60714285714286" stroke="#a3acb9" stroke-width="1.2"/><line x1="639" y1="265.5" x2="639" y2="120" stroke="#a3acb9" stroke-width="1.2"/><path d="M588.0,280.4 L605.0,146.4 L622.0,239.5 L639.0,206.1" fill="none" stroke="#a3acb9" stroke-width="2.2" stroke-dasharray="5 4"/><circle cx="588.0" cy="280.4" r="3.2" fill="#a3acb9"/><circle cx="605.0" cy="146.4" r="3.2" fill="#a3acb9"/><circle cx="622.0" cy="239.5" r="3.2" fill="#a3acb9"/><circle cx="639.0" cy="206.1" r="3.2" fill="#a3acb9"/><line x1="690" y1="266.85714285714283" x2="690" y2="211.71428571428572" stroke="#2f6fde" stroke-width="1.2"/><line x1="707" y1="267" x2="707" y2="231.07142857142858" stroke="#2f6fde" stroke-width="1.2"/><line x1="724" y1="278.85714285714283" x2="724" y2="241.2857142857143" stroke="#2f6fde" stroke-width="1.2"/><line x1="741" y1="243.07142857142858" x2="741" y2="201.39285714285714" stroke="#2f6fde" stroke-width="1.2"/><path d="M690.0,262.9 L707.0,235.6 L724.0,272.5 L741.0,229.9" fill="none" stroke="#2f6fde" stroke-width="2.2" stroke-dasharray="5 4"/><circle cx="690.0" cy="262.9" r="3.2" fill="#2f6fde"/><circle cx="707.0" cy="235.6" r="3.2" fill="#2f6fde"/><circle cx="724.0" cy="272.5" r="3.2" fill="#2f6fde"/><circle cx="741.0" cy="229.9" r="3.2" fill="#2f6fde"/><line x1="580.18" y1="120" x2="580.18" y2="370" stroke="#52606d" stroke-width="1.2" stroke-dasharray="2 3"/><text x="576.18" y="132" font-size="10.5" text-anchor="end" font-weight="700" fill="#52606d">≈1,227</text><line x1="714.14" y1="120" x2="714.14" y2="370" stroke="#2f6fde" stroke-width="1.2" stroke-dasharray="2 3"/><text x="718.14" y="132" font-size="10.5" text-anchor="start" font-weight="700" fill="#2f6fde">≈1,621</text><text x="24" y="420" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">레벨당 5회(monolith)·3회 · 부하 생성기 1.3.13 고정 · 페이서 8(측정 당시 기본) · 1.4.3 2000명은 봇 116명이 무활동 KICK 3(부하 생성기 지연).</text><text x="24" y="438" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">monolith: tick의 약 3/4이 소켓 송신(flush — 운영체제 커널 시간)이다. 1.4.3이 사용자 모드 CPU(서버 코드+GC, −36%)·스냅샷(−20%)을</text><text x="24" y="456" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">  줄여도 flush는 그대로라(750명 13.8 → 13.5 ms) 교차점이 거의 같다.</text><text x="24" y="474" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">게이트웨이 2개: 1.3.13은 1,250명(3런 중 2런 25 ms 초과)과 1,300명(3런 모두 아래)이 엇갈려 실제 경계가 1,300명대 초반일 수 있다.</text><text x="24" y="492" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">  그래서 이득을 +20~32%로 적는다 — 아래쪽은 같은 시간대 비교: 그림에 없는 11:38–11:50 묶음에서 1.4.3 1,650명(49 ms)이</text><text x="24" y="510" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">  1.3.13 1,350·1,400명(63·55 ms)보다 가벼웠고(+18~22%), 오후 파선도 1,650명 37 ms &lt; 1,350명 47 ms다.</text><text x="24" y="528" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">파선(오후, 호스트 바쁨)은 두 버전 모두 잰 범위 전체가 25 ms 위 — 절대 수치는 측정 PC 상태에 크게 좌우된다.</text><text x="24" y="546" font-size="11.5" text-anchor="start" font-weight="400" fill="#52606d">눈금 위로 잘린 세로선: 1.4.3 2000명(최대 105.7 ms), 파선 1.3.13 1,300·1,400명(최대 112.7·94.7 ms).</text>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: codegen drift + typecheck + lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install
        run: bun install --frozen-lockfile

      - name: Codegen drift check
        run: bun run gen:check

      - name: Type check
        run: bun run typecheck

      - name: Lint (biome)
        run: bun run lint

      - name: Tests
        run: bun test
